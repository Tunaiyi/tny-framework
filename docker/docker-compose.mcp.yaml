# tny-framework 开发机 MCP 容器栈（与同目录 docker-compose.yaml 的应用基础设施栈分离；两文件统一收纳于仓库 docker/ 目录）。
#
# 服务形态来自二进制实测（2026-10-01）：
#   docker-mcp(l337) 仅 stdio → 不能常驻，做成 compose run 按需服务，
#   由 MCP 宿主以 `docker compose ... run --rm -T` 方式拉起（等价 docker run -i）。
# 另注：docker mcp gateway 是宿主进程（~/.docker/cli-plugins/docker-mcp），不是容器，不在本文件内。
#
# 用法（现网接线，配置单一来源）：
#   claude mcp add docker -s user -- docker compose -f <本文件绝对路径> --profile stdio run --rm -T --name tny-mcp-docker mcp-docker
#   GitHub MCP 不再经过本文件：2026-10-04 起改接 GitHub 托管远程端点 + PAT（见注③与 mcp-env-init skill §1）。
# 注①：--name 固定容器名（run 忽略服务级 container_name，实测 v5.5.1）；副作用=单实例，
#      多会话并行或 claude mcp list 外部探测在会话容器在役时会撞名，属预期非故障。
# 注②：曾评估并移除常驻 http 服务（mcp-github, serve profile, :8082）：
#      实测其授权链 authorization_servers=GitHub 本体 → Claude Code 走它必撞 DCR 死路，
#      仅当自备 PAT 或多客户端共享端点需求出现时再恢复（定义见本文件 git 历史）。
# 注③：2026-10-04 GitHub MCP 接线改为 GitHub 托管远程端点 + 静态 PAT header
#      （claude mcp add github -s user -t http https://api.githubcopilot.com/mcp/ -H "Authorization: Bearer <PAT>"），
#      原 stdio+OAuth 服务 mcp-github-stdio（含 127.0.0.1:8085 回调映射）随之移除，定义见本文件 git 历史。
#      DCR（动态客户端注册）只挡 OAuth 流程，不挡远程端点的 PAT header 鉴权；若远程端点某日不可达
#      （代理故障等），可从 git 历史恢复 stdio 备胎，或恢复注②的常驻服务并让服务端自备 PAT（届时不再撞 DCR）。
#
name: tny-mcp

services:
  mcp-docker:
    image: ghcr.io/l337-org/docker-mcp-server:2.2.6
    profiles: ["stdio"]
    # stdio 型：stdin 必须是 MCP 管道 → 只随 compose run 使用，不参与 up
    # 固定名由注册命令的 run --name tny-mcp-docker 实现（compose 已知行为：run 忽略服务级
    # container_name，只认 --name）。⚠ 固定名=单实例：多会话并行/健康探测二次 spawn 会撞名。
    stdin_open: true
    volumes:
      # VM 侧 docker socket（OrbStack 架构下容器与 daemon 同 VM，此路径可用；
      # 与 Claude 现状入口 claude mcp add docker 完全等价）
      - /var/run/docker.sock:/var/run/docker.sock

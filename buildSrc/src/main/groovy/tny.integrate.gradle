// 分支流转门禁约定插件（capability branch-integration-gates；redesign-devline-integration-model 设计 D3/D4/D5）。
// 两个任务各固化一个顺序动作：integrateMain 把开发版本分支（dev/N.M.x）按"先同步、后整体合并、再下线"
// 固定顺序集成进 main，并执行开发版本分支集成顺序检查；mergeUpward 把 release 维护分支的补丁以整条分支
// 合并方式向上合并进更更新的分支与 main，提交前执行合并结果完整性检查，任一缺陷标记在合并结果中缺失
// 即回滚并拒绝。合并冲突一律 abort 加 reset 回目标分支原头（三方保持原状）后交人工。
// 通道分界（D6）不变：写与依赖执行期引用的查询走 git CLI（-PgitExe 覆盖），纯仓库状态查询走 grgit；
// -PdryRun 预览不触 CLI。
import tny.convention.GitFlow
import tny.convention.GitCli

def gitFlow = rootProject.extensions.getByType(GitFlow)
def grgiter = gitFlow.grgiter
def gitExe = (project.findProperty('gitExe') ?: 'git').toString()
def runGit = { List args -> GitCli.run(rootDir, gitExe, args) }
def requireGit = { List args, String failMsg -> GitCli.require(runGit(args), failMsg) }

def trackedDirty = {
    def st = grgiter.status()
    (st.staged.allChanges + st.unstaged.modified + st.unstaged.removed).toList()
}

def current = gitFlow.branchName.toString()
def remoteName = gitFlow.resolveRemoteName(current)
def requireRemote = {
    if (remoteName == null) throw new GradleException("无法确定远端：分支 '${current}' 没有上游且仓库远端数量不是 1")
    remoteName
}
// 编号提取用 find 语义（'dev/5.7.x' 这类带前缀名无法全串 matches，误用 matches 会让
// 一切数值比较静默失效——e2e 第五轮实锤的教训）；键值 主*1000+次 为字典序数值化。
def num = { String branch ->
    def m = (branch =~ /(\d+)\.(\d+)\.x$/)
    m.find() ? (m.group(1) as int) * 1000 + (m.group(2) as int) : -1
}
def remoteRefHas = { String branch ->
    runGit(['ls-remote', '--heads', remoteName, "refs/heads/${branch}"]).out.trim() != ''
}
def remoteReleaseLines = {
    runGit(['ls-remote', '--heads', remoteName, 'refs/heads/release/*']).out.readLines()
            .collect { it.split('\\s+')[1] }.findAll { it =~ /^refs\/heads\/release\/\d+\.\d+\.x$/ }
            .collect { it - 'refs/heads/' }
}
def remoteDevLines = {
    runGit(['ls-remote', '--heads', remoteName, 'refs/heads/dev/*']).out.readLines()
            .collect { it.split('\\s+')[1] }.findAll { it =~ /^refs\/heads\/dev\/\d+\.\d+\.x$/ }
            .collect { it - 'refs/heads/' }
}
// 默认标记提取：被搬运提交（目标原头之后、源分支之内的非合并提交）说明中的缺陷编号形态
// （大写字母-数字，如 BUG-101、CVE-2026-1234 取全串）；提取为空时返回空清单——
// 修复提交必须带编号由 commit-msg 钩子与 CI 校验保证（本变更任务 6.1），此处不重复执法。
def autoMarkers = { String targetHead, String src ->
    def log = runGit(['log', '--no-merges', '--format=%s', "${targetHead}..${src}"]).out
    def found = [] as LinkedHashSet
    log.readLines().each { line ->
        (line =~ /\b[A-Z][A-Z0-9]*(?:-[0-9]+)+\b/).each { found << it[0] }
    }
    found.toList()
}

tasks.register('integrateMain') {
    group = 'release'
    description = 'Integrate the current dev/<N.M>.x branch into main with the fixed order (merge main in first, then merge the branch into main with a merge commit, then retire the branch). Enforces the integration order check. Optional -PreleaseVersion=<N.M>.0 for the ledger message, -PdryRun for preview.'
    doLast {
        if (!(current ==~ /dev\/\d+\.\d+\.x/)) {
            throw new GradleException("integrateMain 必须在开发版本分支（dev/<主>.<次>.x）上执行，当前分支 '${current}'")
        }
        requireRemote()
        def dirty = trackedDirty()
        def preview = project.hasProperty('dryRun')
        if (!dirty.isEmpty()) {
            if (preview) {
                logger.lifecycle('[dryRun][warn] 跟踪文件有未提交变更，真实执行将被阻断：\n' + dirty.join('\n'))
            } else {
                throw new GradleException("integrateMain 要求跟踪文件无未提交变更，当前脏项：\n" + dirty.join('\n'))
            }
        }
        def myNum = num(current)
        def rv = project.findProperty('releaseVersion')?.toString()
        // 集成顺序检查（规格：发布顺序等于版本顺序）：任一低编号开发版本分支仍存在
        // （本模型梯毕即删线，存在即未集成未下线），即拒绝；确需放弃的低编号线先按
        // 改号跳号程序注销（删除分支并在提交说明登记）。本地与远端并集枚举。
        def lowerLines = (grgiter.branch.list().collect { it.name } + remoteDevLines()).toUnique()
                .findAll { it ==~ /dev\/\d+\.\d+\.x/ && it != current && num(it) in 0..<myNum }
        if (!lowerLines.isEmpty()) {
            throw new GradleException("开发版本分支集成顺序检查失败：低编号开发分支 ${lowerLines.join('、')} 仍存在且未完成集成到主干" +
                    '（本模型集成完成后即删除该分支）——先完成低编号系列集成，或按改号跳号程序注销该线')
        }
        def plan = """integrateMain 计划：
  同步        先把 ${remoteName}/main 合并进 ${current}（冲突在本分支解决）
  集成        切 main，--no-ff 合入 ${current}，提交说明 integrate ${current} to main${rv ? "：${rv}" : ''}
  下线        删除 ${current}（本地与远端）——该系列后续补丁只走 release 维护分支
  前置        集成顺序检查已通过（低编号在途开发分支为零）"""
        if (preview) { logger.lifecycle('[dryRun] 未做任何变更\n' + plan); return }
        logger.lifecycle(plan)
        requireGit(['fetch', remoteName, 'refs/heads/main:refs/remotes/' + remoteName + '/main'], '刷新 main 远端引用失败')
        def sync = runGit(['merge', '--no-edit', "${remoteName}/main"])
        if (sync.exit != 0) {
            runGit(['merge', '--abort'])
            throw new GradleException("主干同步合并发生冲突（在 ${current} 上）：已 abort 保持原状。请人工 git merge ${remoteName}/main 解决后重跑本任务")
        }
        requireGit(['push', remoteName, "refs/heads/${current}"], '推送同步结果失败')
        requireGit(['switch', 'main'], '切换 main 失败')
        requireGit(['merge', '--ff-only', "${remoteName}/main"], 'main 本地头与远端不一致且无法快进对齐')
        def msg = "integrate ${current} to main" + (rv ? ": ${rv}" : '')
        requireGit(['merge', '--no-ff', '--no-edit', '-m', msg, current], '整体合并进 main 失败')
        def ps = runGit(['push', remoteName, 'refs/heads/main'])
        if (ps.exit != 0) {
            throw new GradleException("推送 main 失败：${ps.err.trim()}\n本地合并已完成——远端 main 被他人推进时先 git pull --ff-only ${remoteName} main 再重跑推送")
        }
        requireGit(['branch', '-d', current], "删除已集成分支 ${current} 失败")
        if (remoteRefHas(current)) runGit(['push', remoteName, "--delete", current])
        logger.lifecycle("integrateMain 完成：${current} 已集成进 main 并下线。下一步 ./gradlew releaseCut -PreleaseVersion=${rv ?: '<N.M>.0'}（在 main 上）切该系列的 release 维护分支。")
    }
}

tasks.register('mergeUpward') {
    group = 'release'
    description = 'Merge the current release maintenance branch upward into the newer release maintenance branches and main (merge-forward), with the merge-result completeness check before each commit. Targets default to all higher-numbered release/N.M.x branches plus main; override with -Pinto=release/5.9.x,main. -Pmarkers=BUG-101,CVE-2 lists the defect markers that must survive each merge; default extracts markers from merged commit messages. Needs -PdryRun for preview.'
    doLast {
        if (!(current ==~ /release\/\d+\.\d+\.x/)) {
            throw new GradleException("mergeUpward 必须在 release 维护分支上执行（源分支），当前分支 '${current}'；开发版本分支的修复随其集成到主干进入 main，不走本任务")
        }
        requireRemote()
        def source = current
        def myNum = num(source)
        def targets = project.findProperty('into')?.toString()?.split(',')?.collect { it.trim() }
        if (!targets) {
            targets = remoteReleaseLines().findAll { num(it) > myNum } + ['main']
        }
        def explicitMarkers = project.findProperty('markers')?.toString()?.split(',')?.collect { it.trim() }?.findAll { it }
        def plan = """mergeUpward 计划（向上合并，机制为整条分支合并）：
  源分支      ${source}（本地头 ${gitFlow.commitId.take(10)}）
  目标序列    ${targets.join('、')}
  每目标动作  merge 源分支（冲突即 abort 回原头）→ 合并结果完整性检查（提交前）→ 普通推送
  检查标记    ${explicitMarkers ? '显式清单 ' + explicitMarkers.join('、') : '自动从被搬运提交说明提取缺陷编号模式'}"""
        if (project.hasProperty('dryRun')) { logger.lifecycle('[dryRun] 未做任何变更\n' + plan); return }
        logger.lifecycle(plan)
        for (target in targets) {
            def targetHead = runGit(['rev-parse', "--verify", '-q', target]).out.trim()
            if (targetHead.isEmpty()) {
                requireGit(['switch', '-c', target, "${remoteName}/${target}"], "检出目标 '${target}' 失败（本地与远端均不存在？）")
                targetHead = runGit(['rev-parse', target]).out.trim()
            } else {
                requireGit(['switch', target], "切换目标 '${target}' 失败")
            }
            requireGit(['fetch', remoteName, "refs/heads/${target}:refs/remotes/${remoteName}/${target}"], '刷新目标远端引用失败')
            def merged = runGit(['merge', '--no-edit', '-m', "merge-upward: ${source} -> ${target}", source])
            if (merged.exit != 0) {
                runGit(['merge', '--abort'])
                requireGit(['reset', '--hard', targetHead], "回退目标 '${target}' 到原头失败")
                requireGit(['switch', source], "切回源分支 '${source}' 失败")
                throw new GradleException("向上合并 ${source} -> ${target} 发生冲突：已 abort 并使目标与源保持原状。" +
                        "人工处置：git switch ${target} && git merge ${source} 解决后自行执行合并结果完整性检查（见规格场景），完成后推送并重跑本任务跳过已入账部分")
            }
            def markers = explicitMarkers ?: autoMarkers(targetHead, source)
            def missing = markers.findAll { ref ->
                runGit(['grep', '-c', '--', ref, 'HEAD']).out.readLines()
                        .collect { (it.split(':')[-1]) }.findAll { it.isInteger() }
                        .collect { it as int }.sum(0) == 0
            }
            if (!missing.isEmpty()) {
                requireGit(['reset', '--hard', targetHead], "回退目标 '${target}' 到原头失败")
                requireGit(['switch', source], "切回源分支 '${source}' 失败")
                throw new GradleException("合并结果完整性检查拦截 ${source} -> ${target}：合并结果中检索不到标记 ${missing.join('、')}" +
                        '（修复内容在冲突解决中丢失）。目标已回退原头、保持未提交状态；重新解决冲突后重跑，' +
                        '或按规格例外通道登记该标记在目标结构中不存在并在新结构重做')
            }
            def ps = runGit(['push', remoteName, "refs/heads/${target}"])
            if (ps.exit != 0) {
                throw new GradleException("推送目标 '${target}' 失败：${ps.err.trim()}\n本地合并与检查已完成——目标被他人推进时先在该目标 git pull --no-edit ${remoteName} ${target} 并入后重跑本任务")
            }
            logger.lifecycle("mergeUpward：${source} -> ${target} 完成（标记核对 ${markers.size()} 项），已推送。")
        }
        requireGit(['switch', source], "切回源分支 '${source}' 失败")
        logger.lifecycle("mergeUpward 全部完成：${source} 的补丁已逐级到达 ${targets.join('、')}；源分支与既有标签未移动。")
    }
}

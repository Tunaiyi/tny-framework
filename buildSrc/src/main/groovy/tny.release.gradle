// 发布快速通道约定插件（语义契约见 openspec capability release-versioning 与
// docs/release-process.md；形态与修复验收点见 openspec change revise-release-branch-flow
// 的 design.md 决策 D1/D2/D10）。三个任务各固化一个顺序动作：releaseCut 切出
// <V>.release 容器并推送（不建标签），releaseTag 在制品定型点建附注标签 v<V> 并推送
// （标签即构建提交、先于制品），releaseMergeBack 把容器独有提交重放到所属冻结线头并
// 普通推送；容器与标签一经创建推送永不移动，--force-with-lease 随之退役。
// 通道分界（设计 D6）：写与本地状态推进走 git CLI（-PgitExe 可覆盖二进制），
// 纯查询走 grgit；三任务的 -PdryRun 预览不触 CLI，本机 PATH git 损坏时预览照常可用。

import tny.convention.GitFlow

def gitFlow = rootProject.extensions.getByType(GitFlow)
def grgiter = gitFlow.grgiter

// git CLI 助手：调用方必须查 exit（D10（二）：查询失败不得被当成空输出）
def runGit = { List args ->
    def exe = (project.findProperty('gitExe') ?: 'git').toString()
    def probe = providers.exec {
        commandLine ([exe] + args)
        workingDir = rootDir
        ignoreExitValue = true
    }
    def result = probe.result.get()
    [exit: result.exitValue, out: probe.standardOutput.asText.get(), err: probe.standardError.asText.get()]
}

def requireGit = { List args, String failMsg ->
    def r = runGit(args)
    if (r.exit != 0) { throw new GradleException("${failMsg}：${r.err.trim()}") }
    r
}

// 上游解析走 grgit（实测见归档变更 migrate-git-calls-to-grgit 的 probe-jgit-remote.md）
def resolveRemote = { String branch ->
    def tracked = grgiter.branch.list().find { it.name == branch }?.trackingBranch?.name
    if (tracked != null && tracked.contains('/')) {
        return tracked.substring(0, tracked.indexOf('/'))
    }
    def remotes = grgiter.remote.list().collect { it.name }
    remotes.size() == 1 ? remotes[0] : null
}

// 只拦跟踪文件变更：grgit status() 把未跟踪归入 unstaged.added，排除该桶即合口径
def trackedDirty = {
    def st = grgiter.status()
    (st.staged.allChanges + st.unstaged.modified + st.unstaged.removed).toList()
}

def requireCleanTree = { String action, boolean preview ->
    def dirty = trackedDirty()
    if (dirty.isEmpty()) return
    if (preview) {
        logger.lifecycle('[dryRun][warn] 跟踪文件有未提交变更，真实执行将被阻断：\n' + dirty.join('\n'))
    } else {
        throw new GradleException("${action} 要求跟踪文件无未提交变更，当前脏项：\n" + dirty.join('\n'))
    }
}

def remoteRefNames = { String remoteName, boolean heads, boolean tags ->
    grgiter.lsremote(remote: remoteName, heads: heads, tags: tags).keySet().collect { it.fullName }
}

def requireReleaseVersion = { String action ->
    def v = project.findProperty('releaseVersion')?.toString()
    if (v == null || v.isEmpty()) {
        throw new GradleException("${action} 需要 -PreleaseVersion=<主>.<次>.<补丁>，例如 -PreleaseVersion=5.7.8")
    }
    if (!(v ==~ /\d+\.\d+\.\d+/)) {
        throw new GradleException("版本号 '${v}' 不符合裸三段号形态 <主>.<次>.<补丁>")
    }
    v
}

def assertNotLegacyOccupied = { String v ->
    def legacyFile = rootProject.file('gradle/released-legacy.txt')
    def legacy = legacyFile.exists() ? legacyFile.readLines().findAll { !it.trim().isEmpty() && !it.trim().startsWith('#') } : []
    if (legacy.contains(v)) {
        throw new GradleException("版本 '${v}' 已以 -RELEASE 后缀形态发布（见 gradle/released-legacy.txt），禁止裸号复用同号，请提高补丁号")
    }
}

tasks.register('releaseCut') {
    group = 'release'
    description = 'Cut <V>.release container branch from a source ref and push it (no tag yet; the tag comes from releaseTag at artifact finalization). Needs -PreleaseVersion=N.M.K, optional -PreleaseFrom=<branch|tag|commit>, -PdryRun for preview.'
    doLast {
        def v = requireReleaseVersion('releaseCut')
        assertNotLegacyOccupied(v)
        def targetBranch = "${v}.release"
        def tagName = "v${v}"
        def current = gitFlow.branchName.toString()
        def from = project.findProperty('releaseFrom')?.toString()
        if (from == null) {
            // D3 与 D10（六）：仅冻结线形态允许缺省推断；hotfix 必须显式上一版本标签
            if (!(current ==~ /\d+\.\d+\.x/)) {
                throw new GradleException("无法从当前分支 '${current}' 推断发布来源：常规发布请在冻结线形态分支上执行本任务，" +
                        "hotfix 必须显式给出上一版本标签（例如 -PreleaseFrom=v5.7.8，设计 D3 禁止自动推断）")
            }
            from = current
        }
        if (grgiter.branch.list().any { it.name == targetBranch }) throw new GradleException("本地已存在分支 '${targetBranch}'，同号发布禁止重复切支")
        if (grgiter.tag.list().any { it.name == tagName }) throw new GradleException("本地已存在标签 '${tagName}'，同号发布禁止重复建标")
        def remoteName = resolveRemote(current)
        if (remoteName == null) {
            throw new GradleException("无法确定推送目标的远端：当前分支 '${current}' 没有上游，且仓库远端数量不是 1")
        }
        // 前缀匹配同时拦精确同号与 v<X> 撞 v<X>-rc1 之类前缀撞名
        def remoteRefs = remoteRefNames(remoteName, true, true)
        if (remoteRefs.any { it.startsWith("refs/heads/${targetBranch}") }) {
            throw new GradleException("远端 '${remoteName}' 已存在分支 '${targetBranch}'")
        }
        if (remoteRefs.any { it.startsWith("refs/tags/${tagName}") }) {
            throw new GradleException("远端 '${remoteName}' 已存在标签 '${tagName}'（或存在前缀撞名，请核对后处理）")
        }
        def preview = project.hasProperty('dryRun')
        requireCleanTree('releaseCut', preview)
        def plan = """releaseCut 计划：
  来源        ${from}
  容器分支    ${targetBranch}（切自来源、检出并推送；发布前容器只允许快进式追加修复提交）
  标签        不创建——标签由 releaseTag 在制品定型后创建（标签先于制品，顺序由两步固化）
  推送远端    ${remoteName}
后续步骤：（hotfix 先在容器上完成修复提交并推送）  ./gradlew releaseTag   然后  ./gradlew publish   然后  ./gradlew releaseMergeBack"""
        if (preview) {
            logger.lifecycle('[dryRun] 未做任何变更\n' + plan)
            return
        }
        logger.lifecycle(plan)
        requireGit(['switch', '-c', targetBranch, from], '切发布分支失败')
        requireGit(['push', remoteName, "refs/heads/${targetBranch}:refs/heads/${targetBranch}"], '推送容器分支失败')
        logger.lifecycle("releaseCut 完成：${targetBranch} 已从 ${from} 切出并推送。下一步在容器上完成修复（如有）后执行 ./gradlew releaseTag（标签即制品），再 ./gradlew publish。")
    }
}

tasks.register('releaseTag') {
    group = 'release'
    description = 'Create annotated tag v<V> at the release container HEAD (the artifact commit) and push it — run right before publish, after any hotfix commits are final. Needs -PreleaseVersion=N.M.K, -PdryRun for preview.'
    doLast {
        def v = requireReleaseVersion('releaseTag')
        def current = gitFlow.branchName.toString()
        def targetBranch = "${v}.release"
        def tagName = "v${v}"
        if (current != targetBranch) {
            throw new GradleException("releaseTag 必须在目标版本的发布容器上执行（当前应为 '${targetBranch}'），当前分支 '${current}'——请先检出容器分支，或确认 hotfix 的容器号与版本号一致")
        }
        def existing = grgiter.tag.list().find { it.name == tagName }
        // D10（五）幂等重跑：恰指向当前构建提交则跳过创建只补推送，指向别处为错标拒绝
        if (existing != null && existing.commit?.id != gitFlow.commitId) {
            throw new GradleException("本地标签 '${tagName}' 已存在且指向非当前构建提交（${existing.commit?.id}），同号发布禁止重复建标——容器头若已前进属发布失误，请人工核对后处理")
        }
        def remoteName = resolveRemote(current)
        if (remoteName == null) {
            throw new GradleException("无法确定推送目标的远端：容器分支 '${current}' 没有上游，且仓库远端数量不是 1")
        }
        if (remoteRefNames(remoteName, false, true).any { it.startsWith("refs/tags/${tagName}") }) {
            throw new GradleException("远端 '${remoteName}' 已存在标签 '${tagName}'（或存在前缀撞名，请核对后处理）")
        }
        def preview = project.hasProperty('dryRun')
        requireCleanTree('releaseTag', preview)
        def plan = """releaseTag 计划：
  容器        ${current}（HEAD 即制品构建提交）
  附注标签    ${tagName}（指向容器 HEAD 并单独推送——标签先于制品）
  推送远端    ${remoteName}${existing != null ? '\n  注            本地标签已指向当前构建提交，将跳过创建仅补推送' : ''}
后续步骤：  ./gradlew publish   然后  ./gradlew releaseMergeBack"""
        if (preview) {
            logger.lifecycle('[dryRun] 未做任何变更\n' + plan)
            return
        }
        logger.lifecycle(plan)
        if (existing == null) {
            // tag -a 产出附注标签（等价 git tag -a）；门禁解引用核对依赖附注形态
            requireGit(['tag', '-a', tagName, '-m', "release ${v} from ${targetBranch}"], '创建附注标签失败')
        }
        requireGit(['push', remoteName, "refs/tags/${tagName}:refs/tags/${tagName}"], '推送标签失败')
        logger.lifecycle("releaseTag 完成：${tagName} 指向当前构建提交并已推送至 ${remoteName}。现在执行 ./gradlew publish（门禁核对标签存证），成功后执行 ./gradlew releaseMergeBack。")
    }
}

tasks.register('releaseMergeBack') {
    group = 'release'
    description = 'After ./gradlew publish succeeded, replay the container-only commits onto its dev line N.M.x with cherry-pick and push the line normally (linear history; the container branch and tag never move).'
    doLast {
        def current = gitFlow.branchName.toString()
        if (!(current ==~ /\d+\.\d+\.\d+\.release/)) {
            throw new GradleException("releaseMergeBack 必须在发布分支形态（如 5.7.8.release）上执行，当前分支 '${current}'")
        }
        def v = gitFlow.parseBranchVersion(current)
        def line = v.replaceAll(/\.\d+$/, '.x')
        def lineBranch = grgiter.branch.list().find { it.name == line }
        def remoteName = resolveRemote(current) ?: resolveRemote(line)
        if (remoteName == null) {
            throw new GradleException('无法确定推送目标的远端：发布分支与开发线都没有上游，且仓库远端数量不是 1')
        }
        def preview = project.hasProperty('dryRun')
        def baseRef = line
        if (lineBranch == null) {
            if (!remoteRefNames(remoteName, true, false).contains("refs/heads/${line}")) {
                throw new GradleException("开发线 '${line}' 本地与远端均不存在，hotfix 无法回流——请确认版本线或手动处理")
            }
            // D10（四）：预览不 fetch 不改本地引用；执行路径才重建远程跟踪引用
            if (!preview) {
                requireGit(['fetch', remoteName, "refs/heads/${line}:refs/remotes/${remoteName}/${line}"], '拉取远端开发线失败')
                baseRef = "${remoteName}/${line}"
            }
        }
        requireCleanTree('releaseMergeBack', preview)
        if (!grgiter.tag.list().any { it.name == "v${v}" }) {
            logger.warn("提示：本地未见标签 v${v}，请确认发布切支（releaseCut）、标签创建（releaseTag）与发布均已完成")
        }
        // 区间计数走 grgit（预览不触 CLI）；线本地缺失的预览计数未知，记 -1 待执行期
        def ahead = lineBranch != null ? grgiter.log { range line, current }.size()
                : (preview ? -1 : grgiter.log { range baseRef, current }.size())
        if (ahead == 0) {
            logger.lifecycle("releaseMergeBack：发布分支 '${current}' 相对开发线 '${line}' 无新提交（常规发布切支后未再提交的场景），合回无事可做，跳过。")
            return
        }
        def aheadNote = ahead >= 0 ? "祖先区间超前 ${ahead} 笔，" : '线本地缺失、超前笔数待执行期拉取后计，'
        def plan = """releaseMergeBack 计划（重放策略）：
  检出 ${line} 并按补丁内容取缺、按序 git cherry-pick -x 容器独有提交（${aheadNote}pending 集以执行期 git cherry 为准）
  git push ${remoteName} refs/heads/${line}（普通推送；线被他人推进则拒绝后可重跑）
  注：容器 ${current} 与标签 v${v} 永不移动——标签、容器头、制品三者对账恒等
  前提确认：./gradlew publish 已成功（本任务无法核对制品仓，顺序由发布者保证）"""
        if (preview) {
            logger.lifecycle('[dryRun] 未做任何变更\n' + plan)
            return
        }
        logger.lifecycle(plan)
        def lineHeadBefore = requireGit(['rev-parse', baseRef], '记录开发线原头失败').out.trim()
        requireGit(lineBranch != null ? ['switch', line] : ['switch', '-c', line, baseRef], "检出开发线 '${line}' 失败")
        // 重放集按补丁内容取 '+'：已等价上线的提交天然跳过（D10（一）与空 pick 防护）
        def cherry = requireGit(['cherry', baseRef, current], '查询重放 pending 集失败')
        def pending = cherry.out.readLines().findAll { it.startsWith('+') }.collect { it.substring(1).trim() }
        if (pending.isEmpty()) {
            requireGit(['switch', current], '切回容器失败')
            logger.lifecycle("releaseMergeBack：容器 ${current} 的独有提交按补丁内容已全部存在于 '${line}'（此前已移植），无重放必要，跳过。")
            return
        }
        for (sha in pending) {
            // 失败按 D10（一）保全：abort、reset 回原线头（不清回则先前重放笔残留线上）、回容器
            def cp = runGit(['cherry-pick', '-x', sha])
            if (cp.exit != 0) {
                runGit(['cherry-pick', '--abort'])
                requireGit(['reset', '--hard', lineHeadBefore], "回退开发线到原头 ${lineHeadBefore.take(10)} 失败")
                requireGit(['switch', current], '切回容器失败')
                throw new GradleException("重放 ${sha} 到开发线 '${line}' 发生冲突，已中止并把线回退到 ${lineHeadBefore.take(10)}、切回容器 '${current}'（容器、标签、开发线均保持原状）。" +
                        "请手工完成：git switch ${line} 后按序 cherry-pick -x 区间 ${baseRef}..${current} 的剩余提交，冲突解决后 git cherry-pick --continue，完成后 git push ${remoteName} refs/heads/${line}")
            }
        }
        requireGit(['push', remoteName, "refs/heads/${line}"], "推送 ${line} 失败\n本地重放已完成（线被他人推进时普通推送会被拒——先 git pull --rebase ${remoteName} ${line} 再重跑本任务即可）")
        logger.lifecycle("releaseMergeBack 完成：${pending.size()} 笔提交已重放进 ${line}（线性历史），${line} 已推送；容器 ${current} 与标签 v${v} 就此封存、永不移动。可切回冻结线或 main 继续。")
    }
}

// 发布快速通道约定插件（语义契约：capability release-versioning 与 docs/release-process.md；
// redesign-devline-integration-model 改造）：releaseCut 与 releaseTag 双语义并存——
// 新形态：在 main 上执行 releaseCut -PreleaseVersion=N.M.0 切出该系列唯一的常驻 release 维护分支
// （不建标签）；在 release/N.M.x 上执行 releaseTag 完成下一补丁号校验后建附注标签并推送。
// 祖父轨（gradle/branch-legacy-registry.txt 登记线，至该系列退役）：保留旧一次性发布分支流程
// （从登记线切 <V>.release 容器、容器上打标签），任务 releaseMergeBack 已删除，其语义由
// tny.integrate 的 mergeUpward 取代。通道分界（D6）不变：写与依赖执行期引用的查询走 git CLI
// （-PgitExe 覆盖），纯仓库状态查询走 grgit；-PdryRun 预览不触 CLI。
import tny.convention.GitFlow
import tny.convention.GitCli

def gitFlow = rootProject.extensions.getByType(GitFlow)
def grgiter = gitFlow.grgiter
def gitExe = (project.findProperty('gitExe') ?: 'git').toString()
def runGit = { List args -> GitCli.run(rootDir, gitExe, args) }
def requireGit = { List args, String failMsg -> GitCli.require(runGit(args), failMsg) }

def resolveRemote = { String branch -> gitFlow.resolveRemoteName(branch) }

def trackedDirty = {
    def st = grgiter.status()
    (st.staged.allChanges + st.unstaged.modified + st.unstaged.removed).toList()
}

def requireCleanTree = { String action, boolean preview ->
    def dirty = trackedDirty()
    if (dirty.isEmpty()) return
    if (preview) {
        logger.lifecycle('[dryRun][warn] 跟踪文件有未提交变更，真实执行将被阻断：\n' + dirty.join('\n'))
    } else {
        throw new GradleException("${action} 要求跟踪文件无未提交变更，当前脏项：\n" + dirty.join('\n'))
    }
}

def remoteRefNames = { String remoteName, boolean heads, boolean tags ->
    grgiter.lsremote(remote: remoteName, heads: heads, tags: tags).keySet().collect { it.fullName }
}

def requireReleaseVersion = { String action ->
    def v = project.findProperty('releaseVersion')?.toString()
    if (v == null || v.isEmpty()) throw new GradleException("${action} 需要 -PreleaseVersion=<主>.<次>.<补丁>，例如 -PreleaseVersion=5.7.8")
    if (!(v ==~ /\d+\.\d+\.\d+/)) throw new GradleException("版本号 '${v}' 不符合裸三段号形态 <主>.<次>.<补丁>")
    v
}

def assertNotLegacyOccupied = { String v ->
    def legacyFile = rootProject.file('gradle/released-legacy.txt')
    def legacy = legacyFile.exists() ? legacyFile.readLines().findAll { !it.trim().isEmpty() && !it.trim().startsWith('#') } : []
    if (legacy.contains(v)) throw new GradleException("版本 '${v}' 已以 -RELEASE 后缀形态发布（见 gradle/released-legacy.txt），禁止裸号复用同号，请提高补丁号")
}

// 下一补丁号校验（规格需求一；redesign 设计 D2）：远端该系列最大补丁标签加一必须等于目标补丁号，
// 无标签时要求首发 .0。枚举走 git ls-remote（与标签存证同源，依赖执行期最新引用；解引用行才算数，
// 轻量标签无 ^{} 行天然不参与计数）。
def assertNextPatchNumber = { String rmName, String base, String v ->
    def patch = (v.split('\\.')[2] as Integer)
    def patches = GitCli.remoteTagPatches(rootDir, gitExe, rmName, base)
    def expected = patches.isEmpty() ? 0 : (patches.max() + 1)
    if (patch != expected) {
        throw new GradleException("下一补丁号校验失败：系列 ${base} 远端已有标签最大补丁号 " +
                "${patches.isEmpty() ? '（无）' : patches.max()}，目标版本 '${v}' 应为 '${base}.${expected}'")
    }
}

def current = gitFlow.branchName.toString()
def currentRemote = resolveRemote(current)

tasks.register('releaseCut') {
    group = 'release'
    description = 'New model: on main, cut the series-unique release maintenance branch release/<N.M>.x for first release <N.M>.0 (no tag yet). Grandfather track: on a registered legacy maintenance line, cut a one-off <V>.release branch as before. Needs -PreleaseVersion=N.M.K, optional -PreleaseFrom (grandfather only), -PdryRun for preview.'
    doLast {
        def v = requireReleaseVersion('releaseCut')
        assertNotLegacyOccupied(v)
        def base = v.replaceAll(/\.\d+$/, '')
        def tagName = "v${v}"
        def preview = project.hasProperty('dryRun')
        requireCleanTree('releaseCut', preview)
        def onMain = current == 'main'
        def onLegacy = gitFlow.legacyIdentity(current) == 'maintenance'
        if (!onMain && !onLegacy) {
            throw new GradleException("releaseCut 只允许在 main（新形态切常驻维护分支，版本须为 <N.M>.0）或祖父登记维护线（旧一次性发布分支流程）上执行，当前分支 '${current}'")
        }
        if (onMain) {
            if (!(v ==~ /\d+\.\d+\.0$/)) {
                throw new GradleException("在 main 上切维护分支只用于系列首发 <N.M>.0（先完成该开发分支的集成到主干）；后续补丁直接在 release/${base}.x 上执行 releaseTag；收到 '${v}'")
            }
            def target = "release/${base}.x"
            if (grgiter.branch.list().any { it.name == target }) throw new GradleException("本地已存在分支 '${target}'，每系列维护分支唯一")
            def remoteName = resolveRemote('main')
            if (remoteName == null) throw new GradleException('无法确定 main 的远端：main 没有上游且仓库远端数量不是 1')
            if (remoteRefNames(remoteName, true, false).any { it == "refs/heads/${target}" }) throw new GradleException("远端已存在维护分支 '${target}'，每系列唯一")
            def plan = """releaseCut 计划（新形态切常驻维护分支）：
  维护分支    ${target}（切自 ${remoteName}/main 当前头；前提：dev/${base}.x 已完成集成到主干）
  标签        不创建——由 releaseTag 在该维护分支头创建（标签先于制品）
后续步骤：  git switch ${target}
            然后  ./gradlew releaseTag -PreleaseVersion=${v}   然后  ./gradlew publish"""
            if (preview) { logger.lifecycle('[dryRun] 未做任何变更\n' + plan); return }
            requireGit(['fetch', remoteName, 'refs/heads/main:refs/remotes/' + remoteName + '/main'], '刷新 main 远端引用失败')
            requireGit(['branch', target, "${remoteName}/main"], '切出维护分支失败')
            requireGit(['push', remoteName, "refs/heads/${target}:refs/heads/${target}"], '推送维护分支失败')
            logger.lifecycle("releaseCut 完成：${target} 已切自 ${remoteName}/main 并推送。git switch ${target} 后执行 ./gradlew releaseTag -PreleaseVersion=${v}，再 ./gradlew publish。")
            return
        }
        // 祖父轨：旧一次性发布分支流程原样保留，随 5.7 系列退役整体删除
        def targetBranch = "${v}.release"
        def from = project.findProperty('releaseFrom')?.toString() ?: current
        if (grgiter.branch.list().any { it.name == targetBranch }) throw new GradleException("本地已存在分支 '${targetBranch}'，同号发布禁止重复切支")
        if (grgiter.tag.list().any { it.name == tagName }) throw new GradleException("本地已存在标签 '${tagName}'，同号发布禁止重复建标")
        def remoteName = currentRemote
        if (remoteName == null) throw new GradleException("无法确定推送目标的远端：当前分支 '${current}' 没有上游，且仓库远端数量不是 1")
        def remoteRefs = remoteRefNames(remoteName, true, true)
        if (remoteRefs.any { it.startsWith("refs/heads/${targetBranch}") }) throw new GradleException("远端 '${remoteName}' 已存在分支 '${targetBranch}'")
        if (remoteRefs.any { it.startsWith("refs/tags/${tagName}") }) throw new GradleException("远端 '${remoteName}' 已存在标签 '${tagName}'（或存在前缀撞名，请核对后处理）")
        def plan = """releaseCut 计划（祖父轨旧流程，当前分支 '${current}' 为登记维护线）：
  来源        ${from}
  一次性发布分支  ${targetBranch}（切自来源并推送；标签创建前只接受快进式追加修复）
  标签        不创建——由 releaseTag 在制品定型后创建
后续步骤：（如有修复先完成并推送）  ./gradlew releaseTag   然后  ./gradlew publish"""
        if (preview) { logger.lifecycle('[dryRun] 未做任何变更\n' + plan); return }
        requireGit(['switch', '-c', targetBranch, from], '切一次性发布分支失败')
        requireGit(['push', remoteName, "refs/heads/${targetBranch}:refs/heads/${targetBranch}"], '推送一次性发布分支失败')
        logger.lifecycle("releaseCut 完成：${targetBranch} 已从 ${from} 切出并推送。完成修复（如有）后执行 ./gradlew releaseTag -PreleaseVersion=${v}，再 ./gradlew publish。")
    }
}

tasks.register('releaseTag') {
    group = 'release'
    description = 'Create and push the annotated release tag at the release maintenance branch HEAD (new model, runs on release/<N.M>.x with next-patch-number check and remote-head alignment) or at a legacy one-off branch head (grandfather track). Needs -PreleaseVersion=N.M.K, -PdryRun for preview.'
    doLast {
        def v = requireReleaseVersion('releaseTag')
        def base = v.replaceAll(/\.\d+$/, '')
        def tagName = "v${v}"
        def onMaintenance = current == "release/${base}.x"
        def onLegacyContainer = current == "${v}.release"
        if (!onMaintenance && !onLegacyContainer) {
            throw new GradleException("releaseTag 必须在目标版本的 release 维护分支 'release/${base}.x'（新形态）或同名一次性发布分支 '${v}.release'（祖父轨）上执行，当前分支 '${current}'")
        }
        assertNotLegacyOccupied(v)
        def existing = grgiter.tag.list().find { it.name == tagName }
        // 幂等只放行"附注形态且恰指当前构建提交"；轻量标签与错标一并拒绝（D11（一）语义保留）
        if (existing != null && (existing.tagger == null || existing.commit?.id != gitFlow.commitId)) {
            throw new GradleException("本地标签 '${tagName}' ${existing.tagger == null ? '是轻量标签（无解引用，门禁必拒）' : '指向非当前构建提交（' + existing.commit?.id + '）'}——未推送时人工删除本地错标后重跑本任务；已推送则绝对不动，提高补丁号重发")
        }
        def remoteName = currentRemote
        if (remoteName == null) throw new GradleException("无法确定推送目标的远端：当前分支 '${current}' 没有上游，且仓库远端数量不是 1")
        def preview = project.hasProperty('dryRun')
        if (onMaintenance) {
            if (!preview) {
                requireGit(['fetch', remoteName, "refs/heads/${current}:refs/remotes/${remoteName}/${current}"], '刷新维护分支远端引用失败')
                def remoteHead = runGit(['ls-remote', remoteName, "refs/heads/${current}"]).out.readLines()
                        .find { it.contains("refs/heads/${current}") }?.split('\\s+')?.getAt(0)
                if (remoteHead != null && remoteHead != gitFlow.commitId) {
                    throw new GradleException('本地 HEAD 与维护分支远端头不一致（远端 ' + remoteHead?.take(10) +
                            ' / 本地 ' + gitFlow.commitId.take(10) + '）——先把分支头推送对齐再重跑')
                }
                assertNextPatchNumber(remoteName, base, v)
            } else {
                logger.lifecycle('[dryRun] 提示：远端头对齐与下一补丁号校验在真实执行时进行')
            }
        }
        if (remoteRefNames(remoteName, false, true).any { it.startsWith("refs/tags/${tagName}") }) throw new GradleException("远端 '${remoteName}' 已存在标签 '${tagName}'（或存在前缀撞名，请核对后处理）")
        requireCleanTree('releaseTag', preview)
        def plan = """releaseTag 计划：
  分支        ${current}（HEAD 即制品构建提交）
  附注标签    ${tagName}（单独推送——标签先于制品，落定即封存点${onMaintenance ? '；已含下一补丁号校验与远端头对齐' : '（祖父轨一次性发布分支语义）'}）${existing != null ? '\n  注            本地附注标签已指向当前构建提交，将跳过创建仅补推送' : ''}
后续步骤：  ./gradlew publish${onMaintenance ? '   发布后按补丁影响清单执行  ./gradlew mergeUpward' : ''}"""
        if (preview) { logger.lifecycle('[dryRun] 未做任何变更\n' + plan); return }
        logger.lifecycle(plan)
        if (existing == null) {
            requireGit(['tag', '-a', tagName, '-m', "release ${v} from ${current}"], '创建附注标签失败')
        }
        requireGit(['push', remoteName, "refs/tags/${tagName}:refs/tags/${tagName}"], '推送标签失败')
        // 话术指路的 ./gradlew publish 覆盖内网 Nexus（及本机凭据在位时的 Central 快照通道）；
        // GitHub Packages 镜像有持续集成与本机两个来源（publish-mirror-via-credential-pair 拍板）：
        // 持续集成正式版走 .github/workflows/publish.yml 第三步骤、快照走 snapshot-mirror.yml
        // 定时；发布者本机成对配置 githubPackagesUsername/githubPackagesToken 两属性时，
        // 上面的 ./gradlew publish 亦扇出镜像；未成对配置的机器不含镜像属凭据守卫设计。
        logger.lifecycle("releaseTag 完成：${tagName} 指向当前构建提交并已推送至 ${remoteName}。现在执行 ./gradlew publish（门禁核对 release 标签存证）。")
    }
}

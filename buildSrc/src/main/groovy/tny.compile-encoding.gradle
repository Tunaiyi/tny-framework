// 编译编码钉定共享块（adopt-gradle-official-dsl D4）：Java/Groovy 编译与 javadoc 一律钉
// encoding 属性（gradle.properties，值 UTF-8），消除对 daemon 区域设置的隐式依赖。
// 边界：-parameters 与 fork 等 JavaCompile 参数只属 java 发布模块线（插件模块线历史上不带，
// 不并入本块以免行为面扩大，见变更 verification-notes 的 D4 修正记录）。

tasks.withType(AbstractCompile).configureEach {
    options.encoding = encoding
}
tasks.withType(Javadoc).configureEach {
    options.encoding = encoding
}

import java.text.SimpleDateFormat

// 基准族执行通道约定插件（adopt-gradle-official-dsl 插件化，前身为 gradle/bench-suite.gradle；
// declarative-it-demo-isolation 起族清单数据外提为 benchmarkSuite 扩展，由 :tny-benchmark 模块声明）。
// 本插件负责：benchmarkSuite 扩展贡献与行为来由注释、jmhList/jmhListVerify/jmhSuiteVerify 枚举对账
// 任务与 benchRoutineExport 落盘任务，注册归属 :tny-benchmark 工程；任务名历次迁移不变，工程路径的模块段自 rename-bench-to-benchmark 起为 tny-benchmark。
// 配置面：benchmarkSuite 五清单（tny.convention.BenchmarkSuite）；清单语义的双承载出处见下 jmhSuiteVerify 注释。
// 边界：jmh 静态参数与依赖声明在模块构建文件，执行面规模选择在插件 afterEvaluate；族目录↔清单对账语义出处见
// split-bench-suites 与 refine-bench-routine-triggering。
// 正则拼接来由（自模块 ext 迁入，机制侧知识）：插件会把 includes 列表逗号拼接成单个 JMH 位置参数
// （实测），而 JMH 位置参数语义为"一个正则"——多正则必须自拼 |；臂属筛选走 -p 而非 include 正则
// （实测：`:prod_` 分支 0 选中；JMH 1.37 的 -p 语义是覆写参数域而非过滤，对未声明该字段的基准
// 无排除效应）；速览档与完整档共用同一 include 面，差异只在 quickRunExcludes 显式清单
// （矩阵类烙负向前瞻正则的静默失效陷阱由此消灭，refine-bench-routine-triggering D2）。

def suite = extensions.create('benchmarkSuite', tny.convention.BenchmarkSuite)

// 列清单（锚集定义与 jmh 运行同源 benchmarkSuite 扩展）：CI PR 通道用它证明"清单可枚举"。
// BenchmarkList 由插件 jmhRunBytecodeGenerator 产出于 generatedResourcesDir（非注解处理器阶段）。
tasks.register('jmhList', JavaExec) {
    group = 'benchmark'
    description = 'List JMH benchmarks honoring routine-suite filters. 全量清单：-PbenchAll'
    dependsOn 'jmhCompileGeneratedClasses'
    mainClass = 'org.openjdk.jmh.Main'
    args '-l'
    def listFile = new File(temporaryDir, 'jmhList.txt')
    doFirst {
        def gen = tasks.named('jmhRunBytecodeGenerator').get()
        classpath = sourceSets.jmh.runtimeClasspath + files(gen.generatedResourcesDir)
        if (!project.hasProperty('benchAll')) {
            args project.hasProperty('benchInclude') ? [project.property('benchInclude').toString()] : (suite.routineFamily.get())
        }
        standardOutput = new FileOutputStream(listFile)
    }
    finalizedBy 'jmhListVerify'
    ext.listFile = listFile
}

// 空匹配不可静默绿（spec：名称过滤无匹配不误报绿——JMH -l 空列表退 0，此处显式判红）
tasks.register('jmhListVerify') {
    group = 'benchmark'
    def listTask = tasks.named('jmhList')
    doLast {
        def f = listTask.get().listFile
        def n = f.exists() ? f.readLines().count { it.startsWith('com.') } : 0
        if (n == 0) {
            throw new GradleException('jmhList 过滤后无任何匹配（JMH -l 空列表不报错，此处显式判红）：检查 benchmarkSuite.routineFamily 与 -PbenchAll')
        }
        logger.lifecycle("jmhList: ${n} 个基名条目")
    }
}

// 族属完备性 × 目录双向对账（split-bench-suites D1/3.2）：全量枚举逐类归族；
// 未归族（搬而未登记／族正则漂移）、多族命中、族空面、探针失配——皆显式判红（JMH -l 空列表不报错教训沿用）。
tasks.register('jmhSuiteVerify', JavaExec) {
    group = 'benchmark'
    description = 'Verify every benchmark class is directory-classified (routine/devtest), suites non-empty, facility probe resolves.'
    dependsOn 'jmhCompileGeneratedClasses'
    mainClass = 'org.openjdk.jmh.Main'
    args '-l'
    def listFile = new File(temporaryDir, 'suiteList.txt')
    doFirst {
        def gen = tasks.named('jmhRunBytecodeGenerator').get()
        classpath = sourceSets.jmh.runtimeClasspath + files(gen.generatedResourcesDir)
        standardOutput = new FileOutputStream(listFile)
    }
    doLast {
        def classes = listFile.readLines().findAll { it.startsWith('com.') }
                .collect { it.substring(0, it.lastIndexOf('.')) }.unique()
        def famOf = { String c ->
            def hits = []
            if (suite.routineFamily.get().any { p -> c =~ p }) { hits << 'routine' }
            if (suite.devtestFamily.get().any { p -> c =~ p }) { hits << 'devtest' }
            hits
        }
        def unclassified = classes.findAll { famOf(it).empty }
        if (unclassified) {
            throw new GradleException("基准类未归族（目录不在族子包，或族清单正则漂移）：${unclassified}")
        }
        def multiFamily = classes.findAll { famOf(it).size() > 1 }
        if (multiFamily) {
            throw new GradleException("基准类同时命中多族清单（族界须互斥）：${multiFamily}")
        }
        def routineN = classes.count { famOf(it) == ['routine'] }
        def devN = classes.count { famOf(it) == ['devtest'] }
        if (routineN == 0 || devN == 0) {
            throw new GradleException("族清单空面：routine=${routineN}, devtest=${devN}")
        }
        def probe = classes.findAll { c -> suite.facilityProbes.get().any { p -> c =~ p } }
        if (probe.empty) {
            throw new GradleException("设施探针清单无命中：${suite.facilityProbes.get()}——Smoke 搬偏或清单漂移")
        }
        logger.lifecycle("jmhSuiteVerify: routine ${routineN} 类 / devtest ${devN} 类 / 探针 ${probe.size()} 类，全量 ${classes.size()} 类皆已归族")
    }
}

// 常规族落盘（执行通道 push/夜间同款）：跑默认族清单后把 JSON 复制为 results/bench-<yyyymmdd>-routine.json（日期执行期生成）。
tasks.register('benchRoutineExport') {
    group = 'benchmark'
    description = 'Run routine-suite benchmarks (incl. facility probe) and archive JSON result into results/ with a date fingerprint.'
    dependsOn 'jmh'
    doLast {
        def src = jmh.resultsFile.get().asFile
        if (!src.exists()) {
            throw new GradleException("常规族运行声明完成但结果文件缺失：${src}（spec：产物缺失可发现）")
        }
        // 日期统一钉 UTC（实况教训：runner 时区为 UTC，本地 Asia/Shanghai 差一日，
        // 速览首跑产物落成 bench-20261001-quick.json 与本地日期口径错位——与回写提交时间戳同基准）。
        def dateFormat = new SimpleDateFormat('yyyyMMdd')
        dateFormat.timeZone = TimeZone.getTimeZone('UTC')
        def dateStr = dateFormat.format(new Date())
        // 产物规模标识（refine-bench-routine-triggering D2/差量产物条款）：
        // 速览与完整各自成文件，同日期覆盖限定同规模，逐版对比要求同规模成立。
        def scopeSuffix = (project.hasProperty('benchScope') && project.property('benchScope').toString() == 'quick') ? 'quick' : 'routine'
        def dest = file("${projectDir}/results/bench-${dateStr}-${scopeSuffix}.json")
        dest.parentFile.mkdirs()
        ant.copy(file: src, tofile: dest, overwrite: true)
        logger.lifecycle("benchRoutineExport: ${dest}")
    }
}

// 执行面规模选择（move-bench-suite-selection-into-plugin：gradle-build-style 需求一——
// 分支与中间变量累加属程序性，收编本插件；模块 jmh 块只留声明式静态基线参数）。
// 缺省执行＝常规族（含设施探针）＋六臂参数域，可复现；全量矩阵以 -PbenchAll 显式打开。
// D1：本段注册在 benchParams 段之前——同工程 afterEvaluate 回调按注册顺序执行，
// 显式 -PbenchParams 覆写参数域的优先级承前最后。
afterEvaluate {
    def familyInclude = (suite.routineFamily.get() + suite.facilityProbes.get()).join('|')
    if (project.hasProperty('benchAll')) {
        jmh.includes = ['.*']
    } else if (project.hasProperty('benchInclude')) {
        jmh.includes = [project.property('benchInclude').toString()]   // 单正则语义（JMH 位置参数）
    } else if (project.hasProperty('benchScope') && project.property('benchScope').toString() == 'quick') {
        // 速览规模（refine-bench-routine-triggering D2）：与完整档共用 include 面，
        // 矩阵级退化由夜间与手动的完整规模兜底；排除面是显式清单（新增矩阵类在此登记）
        jmh.includes = [familyInclude]
        jmh.excludes = suite.quickRunExcludes.get()
    } else {
        // 缺省即完整规模（本地直接执行、夜间定时、手动触发）：常规族并设施探针，
        // 两族清单自拼竖线成单正则（插件逗号拼接语义），六臂参数域覆写沿用。
        jmh.includes = [familyInclude]
        jmh.benchmarkParameters = [algo: objects.listProperty(String).value(suite.routineAlgoArms.get())]
    }
    if (project.hasProperty('benchGc')) {
        jmh.profilers = ['gc']            // 分配画像（P3 裁决数据源）
    }
    if (project.hasProperty('benchFast')) {
        // 选择面探针：只验证"哪些 benchmark 会被选中"，不出可信数字。
        jmh.fork = 1
        jmh.warmupIterations = 0
        jmh.iterations = 1
        jmh.warmup = '100ms'
        jmh.timeOnIteration = '100ms'
    }
}

// 参数过滤经 JMH -p（include 正则不匹配参数串，实测证实）；分号分隔多字段。
// 解析循环自模块 jmh{} 迁入本插件（gradle-build-style 需求一：程序性中间变量累加不落模块文件，
// declarative-it-demo-isolation design D5 行数守恒项），语义保持"显式 benchParams 覆写参数域"。
afterEvaluate {
    if (project.hasProperty('benchParams')) {
        Map map = [:]
        project.property('benchParams').toString().split(';').each { kv ->
            def (String k, String v) = kv.split('=', 2)
            map[k] = objects.listProperty(String).value([v])   // MapProperty<String,ListProperty<String>> 实型
        }
        jmh.benchmarkParameters = map
    }
}

// git 派生与版本形态（adopt-gradle-official-dsl 约定插件化，前身为 gradle/git.gradle；
// expose-git-info-extension：导出面由根工程 ext 派生字典改为根工程类型化扩展；
// gitinfo-self-init-and-getters：扩展名更名为 gitFlow、类名更名为 GitFlow，派生值初始化收进类构造器，
// 本插件只负责打开仓库句柄，并经带句柄的构造调用一步完成扩展的创建与注册，
// 唯一写入方仍是本插件的这一处构造调用）。
// 前置约定：grgit 插件由根构建脚本先行应用（第三方插件在 buildSrc 作用域内 apply 会触发
// 类加载器服务缺失，实测 Gradle 8.5），本插件假定 org.ajoberstar.grgit 扩展已就位。
// 本插件负责：打开仓库句柄、以句柄为构造入参一步创建并注册根工程扩展 gitFlow
// （派生值的求值与时序在 GitFlow 构造器内完成）；后缀常量、推导方法与自动生成 getter 的 final 属性在类内声明。
// 边界：不做任务注册、不做发布断言（门禁在 tny.publish，快通道在 tny.release）；
// 对 git 远端的只读查询在此，写操作一律经 tny.release 的 git CLI 通道。
import tny.convention.GitFlow

project.extensions.create('gitFlow', GitFlow, grgit.open(currentDir: project.getRootDir()))

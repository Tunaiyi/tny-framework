// git 派生与版本形态（adopt-gradle-official-dsl 约定插件化，前身为 gradle/git.gradle；
// expose-git-info-extension：导出面由根工程 ext 派生字典改为根工程类型化扩展；
// gitinfo-self-init-and-getters：扩展名更名为 gitFlow、类名更名为 GitFlow，派生值初始化收进类构造器，
// 本插件只负责准备通道，并经带通道的构造调用一步完成扩展的创建与注册，
// 唯一写入方仍是本插件的这一处构造调用；retire-grgit-channel：通道从 grgit 句柄换为
// GitCli 门面，本文件同时删除 linked-worktree 构建禁令）。
// 本插件负责：读取祖父登记表、以 GitCli 门面为构造入参一步创建并注册根工程扩展 gitFlow
// （派生值的求值与时序在 GitFlow 构造器内完成）；后缀常量、推导方法与自动生成 getter 的 final 属性在类内声明。
// 边界：不做任务注册、不做发布断言（门禁在 tny.publish.gate，快通道在 tny.release 与 tny.integrate）；
// 全仓 git 读写统一经 GitCli 门面（GitFlow 的派生与查询方法内部同通道）。
//
// 布局边界（retire-grgit-channel D4 解除禁令）：初版经 grgit/JGit 读 .git，linked worktree 的
// commondir 重定向不被跟随（5.13 与 6.10.1 实测证伪，证据见归档 upgrade-grgit-for-worktrees），
// 曾以 gitdir 位置判据 fail-fast 禁建。通道全 CLI 化后该缺陷库退场，禁令存在理由消失——
// gradle 构建对完整克隆、linked worktree、子模块布局一律开放；发布快速通道仍建议独立完整
// 克隆执行（与并行会话争用 HEAD 与 index 属运营纪律，不再由构建拦截强制）。
import tny.convention.GitCli
import tny.convention.GitFlow

// 祖父登记表（redesign-devline-integration-model D7）：读入 分支名|身份|依据 三列，注释行与空行丢弃。
def legacyRegistryFile = new File(project.getRootDir(), 'gradle/branch-legacy-registry.txt')
def legacyRegistry = legacyRegistryFile.exists() ? legacyRegistryFile.readLines()
        .findAll { !it.trim().isEmpty() && !it.trim().startsWith('#') }
        .collectEntries { def parts = it.split('\\|').collect { p -> p.trim() }; [(parts[0]): parts[1]] } : [:]

project.extensions.create('gitFlow', GitFlow, GitCli.forProject(project),
        legacyRegistry, project.findProperty('releaseVersion')?.toString())

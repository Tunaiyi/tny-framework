// 子工程公共基线装配约定插件（adopt-gradle-official-dsl 插件化，前身为 gradle/subprojects-baseline.gradle）。
// 前置约定：io.spring.dependency-management 由根构建脚本在装配线行先行应用（第三方插件不在
// buildSrc 作用域解析，实测 Gradle 8.5）。本插件负责每个子工程共用的事：应用 idea/maven-publish、
// 声明 BOM 与具名版本管理（集中声明的依赖写法由本脚本内 dependencyNotation() 从版本目录生成）、
// 派生组号与版本（根 ext 单一事实源）。工程依赖解析仓由 settings.gradle 的 dependencyResolutionManagement 单点声明（centralize-resolution-config），本插件不再接入。
// 边界：java 线专属在 tny.java-module，插件线在 tny.plugin-module，发布元数据在 tny.publications；
// 本插件不触碰任务注册。由根构建脚本 configure(subprojects) 一行引入。
// 形态约定：预编译脚本内可应用的插件一律写头部 plugins{} 块（脚本体内 legacy apply plugin
// 触发 ClassLoaderScope 缺失，实测 Gradle 8.5）。

plugins {
    id 'idea'
    id 'maven-publish'
}

dependencyManagement {

    imports {
        mavenBom("org.apache.logging.log4j:log4j-bom:${log4j2Version}")
        mavenBom("com.alibaba.cloud:spring-cloud-alibaba-dependencies:${alibabaCloudVersion}")
        mavenBom("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        mavenBom("com.google.protobuf:protobuf-bom:${protobufVersion}")
        mavenBom("io.netty:netty-bom:${nettyVersion}")
        mavenBom("org.slf4j:slf4j-parent:${slf4jVersion}")
        mavenBom("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")
        mavenBom("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    }

    dependencies {
        // 集中声明接口只接受"组:名:版本"形式的依赖声明写法字符串（传依赖对象会被拒绝，2026-10-03 实测），
        // 故逐条把版本目录读到的依赖交给 dependencyNotation() 转成声明写法字符串；
        // 条目集合与顺序自 condense-managed-coordinates 起保持 20 项不变。
        // redisson
        dependency dependencyNotation(libs.redisson)
        // Apache Commons 系列
        dependency dependencyNotation(libs.commonsIo)
        dependency dependencyNotation(libs.commonsCodec)
        dependency dependencyNotation(libs.commonsBeanutils)
        dependency dependencyNotation(libs.commonsCollections)
        dependency dependencyNotation(libs.commonsCollections4)
        dependency dependencyNotation(libs.commonsConfiguration)
        dependency dependencyNotation(libs.commonsLang)
        dependency dependencyNotation(libs.commonsLang3)
        dependency dependencyNotation(libs.commonsMath3)
        dependency dependencyNotation(libs.commonsCompress)
        dependency dependencyNotation(libs.commonsPool2)
        dependency dependencyNotation(libs.commonsPool)
        dependency dependencyNotation(libs.commonsCrypto)
        dependency dependencyNotation(libs.commonsDbcp2)
        // 注解校验，以及未纳入 BOM 管理的常用库
        dependency dependencyNotation(libs.checkerframework)
        dependency dependencyNotation(libs.errorprone)
        dependency dependencyNotation(libs.guava)
        dependency dependencyNotation(libs.javassist)
        dependency dependencyNotation(libs.xstream)
    }
    generatedPomCustomization {
        enabled = false
    }
}
group rootProject.ext.projectGroup
version rootProject.ext.projectVersion

// 把版本目录读到的依赖转成 Gradle 依赖声明写法字符串（"组:名:版本"，官方文档称 notation）：
// 按公开属性逐段拼接，不依赖对象的 toString（其输出格式非官方承诺）。参数为访问器返回的 Provider。
def dependencyNotation(provider) {
    def dependency = provider.get()
    return "${dependency.group}:${dependency.name}:${dependency.version}"
}

plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
    // 族属清单与枚举/对账/落盘任务在 tny.bench-suite 约定插件（注册归属与任务名不变）
    id 'tny.bench-suite'
    // 横切角色统一插件（consolidate-module-modes-plugin）
    id 'tny.module-modes'
}

// 自述：不发布设施（零发布合同就地核对消费；刻意不带 tny-game- 前缀见 settings 约定注释）
moduleModes {
    enableUnpublished()
}

// 刻意不叫 tny-game-*：不落根构建 moduleProjects 装配线，零发布（openspec capability: benchmark-harness）。
// 引用根 gradle.properties 单一事实来源；不进装配线故需自备 toolchain/编码。
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion.toInteger())
    }
}

tasks.withType(AbstractCompile).configureEach {
    options.encoding = encoding
}

// 基准族清单（split-bench-suites D1 族属双承载的声明面：目录即族属，此清单登记族正则，
// jmhSuiteVerify 双向对账钉死；行为来由注释在 tny.bench-suite 插件）。
benchSuite {
    routineFamily.set(['.*\\.bench\\.net\\.routine\\..*'])
    devtestFamily.set(['.*\\.bench\\.net\\.devtest\\..*'])
    facilityProbes.set(['.*\\.bench\\.net\\.devtest\\.SmokeBenchmark.*'])
    routineAlgoArms.set(['prod_crc64_xortile', 'prod_siphash24_xortile', 'prod_crc32_xortile',
                         'prod_siphash24_xorprod', 'prod_crc32_xorprod', 'prod_siphash24_chacha'])
    quickRunExcludes.set(['.*\\.bench\\.net\\.routine\\.PipelineCryptoMatrixBenchmark.*'])
}

dependencies {
    jmhImplementation project(':tny-game-net')
    jmhImplementation project(':tny-game-net-netty4')
    jmhImplementation project(':tny-game-net-test')
    jmhImplementation libs.mockitoJunitJupiter   // 基准装配复用 mock ctx（版本由根 BOM 管理）
}

// D3 基线纪律入库（原 D2 裸 JavaExec 已废，见 openspec/changes/promote-netbench-to-tny-bench design T2）：
// 缺省执行 = 常规族（含设施探针）+ 下列参数，可复现；全量矩阵以 -PbenchAll 显式打开。
jmh {
    jmhVersion = '1.37'                       // Central 冻结版；插件按此自动接线 core+annprocess
    fork = 2                                  // D3：-f ≥ 2
    warmupIterations = 5
    iterations = 10
    warmup = '500ms'
    timeOnIteration = '1s'
    resultFormat = 'json'
    resultsFile = project.layout.buildDirectory.file('reports/bench/bench-result.json').get().asFile
    def familyInclude = (benchSuite.routineFamily.get() + benchSuite.facilityProbes.get()).join('|')
    if (project.hasProperty('benchAll')) {
        includes = ['.*']
    } else if (project.hasProperty('benchInclude')) {
        includes = [project.property('benchInclude').toString()]   // 单正则语义（JMH 位置参数）
    } else if (project.hasProperty('benchScope') && project.property('benchScope').toString() == 'quick') {
        // 速览规模（refine-bench-routine-triggering D2）：与完整档共用 include 面，
        // 矩阵级退化由夜间与手动的完整规模兜底；排除面是显式清单（新增矩阵类在此登记）
        includes = [familyInclude]
        excludes = benchSuite.quickRunExcludes.get()
    } else {
        // 缺省即完整规模（本地直接执行、夜间定时、手动触发）：常规族并设施探针，
        // 两族清单自拼竖线成单正则（插件逗号拼接语义），六臂参数域覆写沿用。
        includes = [familyInclude]
        benchmarkParameters = [algo: objects.listProperty(String).value(benchSuite.routineAlgoArms.get())]
    }
    if (project.hasProperty('benchGc')) {
        profilers = ['gc']            // 分配画像（P3 裁决数据源）
    }
    // benchParams 显式参数覆写的解析在 tny.bench-suite 插件 afterEvaluate（程序性不入模块文件）
    if (project.hasProperty('benchFast')) {
        // 选择面探针：只验证"哪些 benchmark 会被选中"，不出可信数字。
        fork = 1
        warmupIterations = 0
        iterations = 1
        warmup = '100ms'
        timeOnIteration = '100ms'
    }
}

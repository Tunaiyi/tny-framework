plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
}

// 刻意不叫 tny-game-*：不落根构建 moduleProjects 装配线，零发布（openspec capability: benchmark-harness）。
// 引用根 gradle.properties 单一事实来源；不进装配线故需自备 toolchain/编码。
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion.toInteger())
    }
}
compileJmhJava.options.encoding = "${encoding}"

// 族属双承载（split-bench-suites D1）：目录分置族子包即族属，清单按族子包正则声明，
// CI 两面（评审枚举 / 执行选择）只从这份单一事实派生；目录↔声明对账见 jmhSuiteVerify。
ext {
    // 单一 alternation 正则语义沿用：插件会把 includes 列表逗号拼接成单个 JMH 位置参数（实测），
    // 而 JMH 位置参数语义为"一个正则"——多正则必须自拼 |。
    benchRoutineClasses = ['.*\\.bench\\.net\\.routine\\..*']
    benchDevSuiteClasses = ['.*\\.bench\\.net\\.devtest\\..*']
    // 设施探针：devtest 族成员，恒随执行面运行——执行链存活哨兵，其条目不构成框架性能断言对象。
    benchFacilityProbe = ['.*\\.bench\\.net\\.devtest\\.SmokeBenchmark.*']
    // include 正则不匹配参数串（实测：`:prod_` 分支 0 选中）——生产臂筛选走 -p（JMH 1.37 的 -p 语义是
    // 覆写参数域而非过滤，对未声明该字段的基准无排除效应，实测证实）。臂属选择面问题，不属族属问题（D1）。
    benchRoutineAlgoArms = ['prod_crc64_xortile', 'prod_siphash24_xortile', 'prod_crc32_xortile',
                            'prod_siphash24_xorprod', 'prod_crc32_xorprod', 'prod_siphash24_chacha']
}

dependencies {
    jmhImplementation project(':tny-game-net')
    jmhImplementation project(':tny-game-net-netty4')
    jmhImplementation project(':tny-game-net-test')
    jmhImplementation libs.mockito_junit_jupiter   // 基准装配复用 mock ctx（版本由根 BOM 管理）
}

// D3 基线纪律入库（原 D2 裸 JavaExec 已废，见 openspec/changes/promote-netbench-to-tny-bench design T2）：
// 缺省执行 = 常规族（含设施探针）+ 下列参数，可复现；全量矩阵以 -PbenchAll 显式打开。
jmh {
    jmhVersion = '1.37'                       // Central 冻结版；插件按此自动接线 core+annprocess
    fork = 2                                  // D3：-f ≥ 2
    warmupIterations = 5
    iterations = 10
    warmup = '500ms'
    timeOnIteration = '1s'
    resultFormat = 'json'
    resultsFile = project.layout.buildDirectory.file('reports/bench/bench-result.json').get().asFile
    if (project.hasProperty('benchAll')) {
        includes = ['.*']
    } else if (project.hasProperty('benchInclude')) {
        includes = [project.property('benchInclude').toString()]   // 单正则语义（JMH 位置参数）
    } else {
        // 常规族 ∪ 设施探针：两单元素清单自拼 | 成单正则（插件逗号拼接语义）
        includes = [(benchRoutineClasses + benchFacilityProbe).join('|')]
        benchmarkParameters = [algo: objects.listProperty(String).value(benchRoutineAlgoArms)]
    }
    if (project.hasProperty('benchGc')) {
        profilers = ['gc']            // 分配画像（P3 裁决数据源）
    }
    if (project.hasProperty('benchParams')) {
        // 参数过滤经 JMH -p（include 正则不匹配参数串，实测证实）；分号分隔多字段。
        Map map = [:]
        project.property('benchParams').toString().split(';').each { kv ->
            def (k, v) = kv.split('=', 2)
            map[k] = objects.listProperty(String).value([v])   // MapProperty<String,ListProperty<String>> 实型
        }
        benchmarkParameters = map
    }
    if (project.hasProperty('benchFast')) {
        // 选择面探针：只验证"哪些 benchmark 会被选中"，不出可信数字。
        fork = 1
        warmupIterations = 0
        iterations = 1
        warmup = '100ms'
        timeOnIteration = '100ms'
    }
}

// 列清单（锚集定义与 jmh 运行同源 ext）：CI PR 通道用它证明"清单可枚举"。
// BenchmarkList 由插件 jmhRunBytecodeGenerator 产出于 generatedResourcesDir（非注解处理器阶段）。
tasks.register('jmhList', JavaExec) {
    group = 'benchmark'
    description = 'List JMH benchmarks honoring routine-suite filters. 全量清单：-PbenchAll'
    dependsOn 'jmhCompileGeneratedClasses'
    mainClass = 'org.openjdk.jmh.Main'
    args '-l'
    def listFile = new File(temporaryDir, 'jmhList.txt')
    doFirst {
        def gen = tasks.named('jmhRunBytecodeGenerator').get()
        classpath = sourceSets.jmh.runtimeClasspath + files(gen.generatedResourcesDir)
        if (!project.hasProperty('benchAll')) {
            args project.hasProperty('benchInclude') ? [project.property('benchInclude').toString()] : project.benchRoutineClasses
        }
        standardOutput = new FileOutputStream(listFile)
    }
    finalizedBy 'jmhListVerify'
    ext.listFile = listFile
}

// 空匹配不可静默绿（spec：名称过滤无匹配不误报绿——JMH -l 空列表退 0，此处显式判红）
tasks.register('jmhListVerify') {
    group = 'benchmark'
    def listTask = tasks.named('jmhList')
    doLast {
        def f = listTask.get().listFile
        def n = f.exists() ? f.readLines().count { it.startsWith('com.') } : 0
        if (n == 0) {
            throw new GradleException("jmhList 过滤后无任何匹配（JMH -l 空列表不报错，此处显式判红）：检查 benchRoutineClasses 与 -PbenchAll")
        }
        logger.lifecycle("jmhList: ${n} 个基名条目")
    }
}

// 族属完备性 × 目录双向对账（split-bench-suites D1/3.2）：全量枚举逐类归族；
// 未归族（搬而未登记／族正则漂移）、多族命中、族空面、探针失配——皆显式判红（JMH -l 空列表不报错教训沿用）。
tasks.register('jmhSuiteVerify', JavaExec) {
    group = 'benchmark'
    description = 'Verify every benchmark class is directory-classified (routine/devtest), suites non-empty, facility probe resolves.'
    dependsOn 'jmhCompileGeneratedClasses'
    mainClass = 'org.openjdk.jmh.Main'
    args '-l'
    def listFile = new File(temporaryDir, 'suiteList.txt')
    doFirst {
        def gen = tasks.named('jmhRunBytecodeGenerator').get()
        classpath = sourceSets.jmh.runtimeClasspath + files(gen.generatedResourcesDir)
        standardOutput = new FileOutputStream(listFile)
    }
    doLast {
        def classes = listFile.readLines().findAll { it.startsWith('com.') }
                .collect { it.substring(0, it.lastIndexOf('.')) }.unique()
        def famOf = { String c ->
            def hits = []
            if (project.benchRoutineClasses.any { p -> c =~ p }) { hits << 'routine' }
            if (project.benchDevSuiteClasses.any { p -> c =~ p }) { hits << 'devtest' }
            hits
        }
        def unclassified = classes.findAll { famOf(it).empty }
        if (unclassified) {
            throw new GradleException("基准类未归族（目录不在族子包，或族清单正则漂移）：${unclassified}")
        }
        def multiFamily = classes.findAll { famOf(it).size() > 1 }
        if (multiFamily) {
            throw new GradleException("基准类同时命中多族清单（族界须互斥）：${multiFamily}")
        }
        def routineN = classes.count { famOf(it) == ['routine'] }
        def devN = classes.count { famOf(it) == ['devtest'] }
        if (routineN == 0 || devN == 0) {
            throw new GradleException("族清单空面：routine=${routineN}, devtest=${devN}")
        }
        def probe = classes.findAll { c -> project.benchFacilityProbe.any { p -> c =~ p } }
        if (probe.empty) {
            throw new GradleException("设施探针清单无命中：${project.benchFacilityProbe}——Smoke 搬偏或清单漂移")
        }
        logger.lifecycle("jmhSuiteVerify: routine ${routineN} 类 / devtest ${devN} 类 / 探针 ${probe.size()} 类，全量 ${classes.size()} 类皆已归族")
    }
}

// 常规族落盘（执行通道 push/夜间同款）：跑默认族清单后把 JSON 复制为 results/bench-<yyyymmdd>-routine.json（日期执行期生成）。
tasks.register('benchRoutineExport') {
    group = 'benchmark'
    description = 'Run routine-suite benchmarks (incl. facility probe) and archive JSON result into results/ with a date fingerprint.'
    dependsOn 'jmh'
    doLast {
        def src = jmh.resultsFile.get().asFile
        if (!src.exists()) {
            throw new GradleException("常规族运行声明完成但结果文件缺失：${src}（spec：产物缺失可发现）")
        }
        def dateStr = new java.text.SimpleDateFormat('yyyyMMdd').format(new Date())
        def dest = file("${projectDir}/results/bench-${dateStr}-routine.json")
        dest.parentFile.mkdirs()
        ant.copy(file: src, tofile: dest, overwrite: true)
        logger.lifecycle("benchRoutineExport: ${dest}")
    }
}

        maven { url = 'https://maven.aliyun.com/repository/spring-plugin' }
    }

}

// 工程依赖解析仓的唯一点（centralize-resolution-config D1）：根与全部子工程的解析仓统一在此声明，
// FAIL_ON_PROJECT_REPOS 模式令任何工程私设 repositories 在配置期即报红，杜绝第二书写点
// （实测修正：PREFER_SETTINGS 仅忽略并告警，不满足机器强制意图，declarative 后此变更 2.3 探针定罪）。
// pluginManagement 块与其语义不同（jcenter/spring-plugin 等专供插件解析），两列表并存是有意为之。
// 镜像钉选陷阱（两次首探实测）：tencent 镜像存有 xmlutil rc 版 pom 但缺 jar，
// Gradle 一旦从镜像解析模块元数据即钉选该仓找 jar，其余仓库不再尝试——
// nmcp 与其 xmlutil 依赖组独占路由直连 Central，其余依赖维持镜像优先。
dependencyResolutionManagement {

    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS

    repositories {
        exclusiveContent {
            forRepository { mavenCentral() }
            filter {
                includeGroup('com.gradleup.nmcp')
                includeGroup('io.github.pdvrieze.xmlutil')
            }
        }
        mavenLocal()
        maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url = 'https://m2.tnydev.com/repository/maven-public/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }

}

// 命名约定（共享构建脚本成员判定的唯一依据，zero-enumeration-shared-scripts 成文；
// 根 ext 谓词、BOM 约束、Central 聚合、组号对账、公共夹具与不发布登记均据此归类）：
//   tny-game- 前缀           框架发布模块（装配线总谓词）
//   -bom 后缀                平台约束模块（无编译构件，不进 java 线，进 Central 聚合）
//   -gradle 后缀             Gradle 插件模块（例外组号 com.tny.game，不入 Central）
//   -integration-test 后缀   集成测试专用模块（不进 java 线、不进 BOM 约束面）
//   -tester 后缀             公共测试夹具（自动挂为全部发布模块的测试依赖）
//   刻意不带 tny-game- 前缀  不发布设施（须应用 tny.module-setting 并声明 enableUnpublished()，受零发布合同约束）
// 新增归入上述类别的模块：只改本文件 include 与模块自身构建文件，共享脚本零改动。

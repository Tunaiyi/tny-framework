RELEASE_REPOSITORY_URL=https://m2.tnydev.com/repository/maven-releases/
SNAPSHOT_REPOSITORY_URL=https://m2.tnydev.com/repository/maven-snapshots/
#org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=6
org.gradle.daemon=true
org.gradle.configureondemand=true
#org.gradle.unsafe.configuration-cache=true
org.gradle.jvmargs=-Xms256m -Xmx2048m -Dfile.encoding=UTF-8"
systemProp.org.gradle.internal.publish.checksums.insecure=true
encoding=UTF-8
# 项目 Java 版本单一事实来源：toolchain 与 source/targetCompatibility 均引用此属性（centralize-java-version-property）
javaVersion=21
#
#
#
#===================================
#   Dependencies Versions
#===================================
# 本段只留 BOM 级大头版本（供插件声明与 BOM 导入句取用；gradle-build-style 需求三分工，
# 零取用点的键属违例——2026-10-03 fix-dependency-version-governance 清除 groovyVersion、
# graalvmVersion、icu4jVersion、springCloudVersion 四死键）。
# groovy 与 graalvm 的事实源在 gradle/libs.versions.toml 的 [versions] 段。
nettyVersion=4.1.137.Final
# JMH 工具链版本（tny-benchmark 的 jmh 块与 jmh-core 钉版消费；consolidate-assembly-line 8.3 自模块字面量等值收编）
jmhVersion=1.37
protobufVersion=3.22.2
jacksonVersion=2.16.1
slf4jVersion=2.0.10
springBootVersion=3.2.1
alibabaCloudVersion=2022.0.0.0
log4j2Version=2.22.1
testcontainersVersion=1.21.4
# 与 Netty 事实源 4.1.137 共存选档：矩阵实测绿区间 [1.64.2, 1.84.0]；1.84.0 因腾讯镜像系缺 grpc-grpclb jar（CI run93 实证海外不可得）回落至镜像全同步的最高档（openspec/changes/upgrade-grpc-for-netty-137/verification/matrix.md）
grpcVersion=1.82.4

# Central Portal 校验超时（分钟）；键缺失或留空时 tny.central 回退内置默认 20（centralize-resolution-config D4）
centralValidationTimeoutMinutes=20
# 集成测试 docker socket 候选路径，逗号分隔；留空回退内置 orbstack/docker 默认（换机调参不改脚本）
dockerSocketCandidates=

name: mirror-pilot

# 一次性试点脚手架（openspec change add-github-packages-channel 任务 5.5 批准试点）：
# 验证生产镜像步骤的完整形态——签名、门禁、逐仓镜像任务与 GitHub Packages 接收——
# 只执行单模块逐仓镜像，不触碰内网 Nexus 与 Maven Central。
# 试点分支、本文件、附注标签 v5.7.99 与镜像中的 5.7.99 版本在试点核对后全部清理。
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pilot:
    name: Mirror single module release artifacts to GitHub Packages (pilot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      # 与生产 publish.yml 第三步骤同构的 env 注入：签名三件（发布分支形态必签）、
      # NEXUS 两值（tny.publish 共享仓属性断言不分目标仓）、镜像单密钥取内置令牌。
      - name: Publish tny-game-net to GitHub Packages mirror
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_GITHUB_PACKAGES_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :tny-game-net:publishAllPublicationsToGithubPackagesRepository

name: build

on:
  pull_request:
  push:
    branches: [ main, '5.7.x' ]
  schedule:
    - cron: '37 18 * * *'   # nightly（UTC18:37 错峰）
  workflow_dispatch: {}     # 手动触发（bench-nightly 首验用，benchmark-harness 4.2）

env:
  # Gradle 8.5 daemon 须运行于 JDK ≤21；toolchain 另钉 JDK 21（见 README 构建环境注记）
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

jobs:
  unit:
    name: Unit tests (no Docker)
    runs-on: ubuntu-latest
    services:
      # 既有 tny-game-namnspace-etcd 单测静态依赖本地 etcd:2379（非本变更引入），CI 须提供
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.11
        # 雷②修复：etcd 默认只绑容器内 localhost，宿主映射端口拒连——services 原生 env
        # 直通 ETCD_* 参数（官方 flag→env 映射），令其监听 0.0.0.0。
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
        ports: [ '2379:2379' ]
        # 雷③定案：不设 options/healthcheck。run#10-14 全矩阵证明同镜像下"带 options 的
        # unit 恒败于 Initialize、无 options 的 e2e 恒绿"——YAML 折叠把 --health-cmd 的引号
        # 变字面字符、空格拆参喂 docker 产生垃圾 args（官方示例的 health-cmd 均为无空格
        # 单词，恰为反证），等号形式亦不幸存。就绪性由时序天然保证：容器裸起 ~1s，
        # 首个 etcd 请求发生在 checkout+setup+编译之后（分钟级裕量）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: 'false'
      - name: Unit tests
        run: ./gradlew test --continue

  integration:
    name: Integration tests (real transport + containers, starter 装配与剧本覆盖)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      # docker 档并入 PR 通道（add-starter-net-integration-tests 决策：GH runner 自带 docker，
      # starter 装配/中继剧本/数据容器 IT 需要 PR 反馈；时长代价 +2~4min）
      - name: Integration tests (include docker lane)
        id: it
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew integrationTest -PincludeDocker --continue --console=plain 2>&1 | tee /tmp/it-console.log
      # 诊断电路（run#15 起常驻；匿名 API 拉不到日志正文，git 通道永远可达）：
      # 红时把失败用例 XML + 控制台尾部 force-push 到孤儿分支 ci-it-diag，取卷：
      #   git fetch github ci-it-diag && git show FETCH_HEAD:itdiag/console-tail.txt
      - name: Exfil failing IT evidence to ci-it-diag
        if: steps.it.outcome == 'failure'
        run: |
          git checkout --orphan ci-it-diag
          mkdir -p itdiag
          find . -path "*/build/test-results/integrationTest/*.xml" -print0 2>/dev/null | xargs -0 grep -l "<failure\|<error" 2>/dev/null | while read -r f; do cp "$f" itdiag/; done
          tail -c 200000 /tmp/it-console.log > itdiag/console-tail.txt
          git add -f itdiag
          git -c user.name="ci-it-diag" -c user.email="ci-it-diag@users.noreply.github.com" commit -m "it diag run ${{ github.run_id }}"
          git push -f origin ci-it-diag
      # 保持硬门禁语义不变（阶段一降级是 stabilize 线的选项，不在本电路里擅自生效）
      - name: Fail job when IT failed (gate preserved)
        if: steps.it.outcome == 'failure'
        run: exit 1

  e2e:
    name: Full lane with containers (docker-tagged ITs)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.11   # root 运行且 runner 可拉（run#10 e2e 实证）；quay coreos 版为非 root 用户，services 挂载下 etcd 起不来致 health 恒败
        ports: [ '2379:2379' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: "Integration tests (include docker - Redis/Mongo via Testcontainers)"
        run: ./gradlew integrationTest -PincludeDocker --continue

  bench-compile:
    name: Bench compile check (no timings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      # 职责边界（spec：CI 双通道）：仅编译与枚举清单，零计时——PR 不因基准数字变红，
      # 但基准源码编译破裂与"锚集不可枚举/空匹配"必红（jmhList 对空列表显式判红）。
      - name: Compile benchmarks and verify enumerable list
        run: ./gradlew :tny-bench:jmhCompileGeneratedClasses :tny-bench:jmhList -q

  bench-nightly:
    name: Anchor benchmarks (nightly curve, human verdict)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run anchor set (benchAnchorExport, params declared in tny-bench/build.gradle)
        run: ./gradlew :tny-bench:benchAnchorExport
      - uses: actions/upload-artifact@v4
        with:
          name: bench-anchor-results
          path: tny-bench/results/*.json
          if-no-files-found: error
      - name: Commit anchor result into results/
        run: |
          git config user.name "bench-nightly[bot]"
          git config user.email "bench-nightly@users.noreply.github.com"
          git add -f tny-bench/results/
          git diff --cached --quiet || git commit -m "chore(bench): nightly anchor results [skip ci]"
          git push
      # 历史曲线=信号非门禁（spec：回归判定人裁决）：告警级 alert-threshold，
      # gh-pages 未启用/私有仓场景 continue-on-error 降级（design 风险条）。
      - name: Store benchmark result & trend
        uses: benchmark-action/github-action-benchmark@v1
        continue-on-error: true
        with:
          tool: 'jmh'
          output-file-path: tny-bench/build/reports/bench/bench-result.json
          gh-pages-branch: gh-pages
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          auto-push: true

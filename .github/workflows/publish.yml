name: publish

# 发布工作流（openspec capability central-publishing 与 github-packages-mirror）：
# 三目的地分步独立执行——先内网 Nexus（五重门禁），再 Central 聚合上传（centralCheck 前置），
# 最后 GitHub Packages 镜像（逐仓聚合任务；本工作流的镜像步骤只执行正式版本镜像，
# 快照镜像由 snapshot-mirror.yml 按定时计划逐开发线执行；五重门禁在任务内照常先行）。
# 一个通道失败不掩盖另一个：三个 run 步骤各自独立报错，已成功通道的产物不回退、不被重推。
# 镜像半途失败的同号处置阶梯（升号优先、删版本重发为例外）见 docs/release-process.md 的
# GitHub Packages 镜像通道一节。
# 触发：
#   release.published —— 标签名 v<X.Y.Z> 推导发布分支 <X.Y.Z>.release（标签先于制品，门禁同源校验）
#   workflow_dispatch —— 直接指定发布分支名，人工闸门（Central 不可撤销，不设 push 自动触发）

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: "发布分支名（如 5.7.8.release）"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish release to Nexus, Maven Central and GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Derive release branch
        id: derive
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "branch=${GITHUB_REF_NAME#v}.release" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ steps.derive.outputs.branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      # 签名走无点号环境变量（SIGNING_KEY 为 armor 化私钥本体，不落文件）；
      # 属性类凭据走 ORG_GRADLE_PROJECT_*。均不进命令行与日志（env 注入由 runner 脱敏）。
      - name: Publish to Nexus (five-fold gate runs inside)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: ./gradlew publish

      - name: Upload bundle to Maven Central (centralCheck preflight inside)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal

      # GitHub Packages 镜像步骤（第三个目的地，包归属本仓库；openspec capability github-packages-mirror）：
      # 选用逐仓聚合任务而非聚合 publish——已成功的 Nexus 与 Central 通道不因本步骤被重推，
      # 镜像失败也不波及二者（通道隔离）。tny.github-packages 的守卫断言两个镜像凭据属性
      # 成对在位（githubPackagesUsername 与 githubPackagesToken），正式版本与快照形态均可
      # 声明目的地；本步骤是正式版本镜像的
      # CI 入口，快照镜像由 snapshot-mirror.yml 执行，两文件互不重推。快照可用性复测与开通
      # 裁决记录见归档目录 2026-10-06-probe-github-packages-snapshot-support 的
      # verification/snapshot-spike.md。NEXUS 两值必须一并注入：tny.publish 的属性断言
      # 不区分目标仓库，命中共享仓谓词的发布任务在任一属性为空时 fail-fast。
      # SIGNING 三件与上方步骤同源：发布分支形态必签，.asc 签名是发布任务的依赖构件。
      # 重跑已镜像成功的正式版本时本步骤对同名文件收 HTTP 409 属"构件已在镜像中"的存证
      #（限正式版本形态；快照重发以时间戳文件名存储不受此限），
      # 判读与处置阶梯见 docs/release-process.md 的 GitHub Packages 镜像通道一节。
      # env 注入不进命令行与日志（runner 对 secrets 脱敏），与上方步骤既有注记同一手法。
      - name: Publish to GitHub Packages (release-only mirror)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesToken: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository

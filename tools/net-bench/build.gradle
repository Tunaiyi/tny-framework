plugins {
    id 'java'
}

// 引用根 gradle.properties 单一事实来源；不进 moduleProjects 故需自备 toolchain/编码
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion.toInteger())
    }
}
compileJava.options.encoding = "${encoding}"

dependencies {
    implementation project(':tny-game-net')
    implementation project(':tny-game-net-netty4')
    implementation project(':tny-game-net-test')
    implementation 'org.openjdk.jmh:jmh-core:1.37'
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    implementation libs.mockito_junit_jupiter   // 基准装配复用 mock ctx（版本由根 BOM 管理）
}

// JMH 经 annotation processor 生成 META-INF/BenchmarkList 后裸跑（D2，无外部插件）
tasks.register('bench', JavaExec) {
    group = 'benchmark'
    description = 'Run JMH benchmarks. 过滤示例：-PjmhArgs="-l" 仅列出；-PjmhArgs="PacketCodec" 按名匹配'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    if (project.hasProperty('jmhArgs')) {
        args project.property('jmhArgs').toString().split(/\s+/).findAll { !it.isEmpty() }
    }
}

# F2 拓扑·第一跳转发应用（ForwardApp）装配声明（design D7，任务 3.3）。
# 双 forwardable 承重修正同 F1（终端回执落拨出会话，回程接收侧也须可转发）。
# 与 F1 forward 唯一差异：cluster 的 game-service 拨向**第二跳转发**（it.f2.rpc.port）
# 而非终端——两跳级联的 to 重写语义（D7）在此接受实证。rpc 条目不加 serve-name（D5 终形补记）。
# 运行期占位：it.f1.rpc.port（本节点 RPC 服务端点）、it.f2.rpc.port（第二跳端点）、it.redis.*
tny:
  data:
    enable: false
  app:
    name: t2-forward1
    app-type: gateway-service
    scope-type: online
  net:
    bootstrap:
      rpc:
        server:
          name: gateway-service
          forwardable: true
          bind-address: "${it.host}:${it.f1.rpc.port}"
          channel:
            encoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
            decoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
        client:
          forwardable: true
          channel:
            encoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
            decoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
    rpc:
      cluster:
        services:
          - service: game-service
            discovery: false
            host: "${it.host}"
            port: ${it.f2.rpc.port}
            username: game-client

spring:
  # 官方 redisson starter 无缝可退：统一指容器（T2 实证）
  data:
    redis:
      host: "${it.redis.host}"
      port: ${it.redis.port}
      password: '${it.redis.password}'

# F1 拓扑·转发应用（RelayNodeApp + @EnableNetApplication）装配声明（design D7，任务 3.1）。
# 关键双 forwardable（反驳核验承重修正）：终端 RESPONSE 落在本进程 rpc.client 拨出会话上，
# 回程 tryForward 需要接收侧 bootstrap 也开启 forwardable——server 与 client 两段都写。
# 身份：rpc.server 名 gateway-service（caller 的 forwardService 键）；拨出 username=game-client。
# 键空间警示（design D5 终形补记）：rpc.cluster.services 条目 MUST NOT 加 serve-name——
# 框架 isDiscovery()=discovery||isNoneBlank(serveName)，加了会把静态直拨静默翻转为发现模式断链。
# 运行期占位：it.f.rpc.port（本节点 RPC 服务端点）、it.g2.rpc.port（终端 game-2 RPC 端点）、it.redis.*
tny:
  data:
    enable: false
  app:
    name: t1-forward
    app-type: gateway-service
    scope-type: online
  net:
    bootstrap:
      rpc:
        server:
          name: gateway-service
          forwardable: true
          bind-address: "${it.host}:${it.f.rpc.port}"
          channel:
            encoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
            decoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
        client:
          forwardable: true
          channel:
            encoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
            decoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
    rpc:
      cluster:
        services:
          - service: game-service
            discovery: false
            host: "${it.host}"
            port: ${it.g2.rpc.port}
            username: game-client

spring:
  # 官方 redisson starter 无缝可退：统一指容器（T2 实证）
  data:
    redis:
      host: "${it.redis.host}"
      port: ${it.redis.port}
      password: '${it.redis.password}'

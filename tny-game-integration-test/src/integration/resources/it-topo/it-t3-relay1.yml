# T3 拓扑·级联第一跳独立中继（RelayNodeApp，server+client 双角色——design D5"级联每级
# 同形，唯一差异是 yml"）装配声明（任务 2.2 T3 级联 relay-2 段——审计 CRITICAL 补齐实体）。
# 与 it-t2-relay.yml 的唯一拓扑差异：client 集群拨向**下一级中继 relay-2**
# （it.r2.server.port）而非业务应用 game-2。
# 键空间与 codec 点名约定同 it-t2-relay.yml。
# 运行期占位：it.r1.server.port（本节点服务端点）、it.r2.server.port（relay-2 服务端点）、it.redis.*
tny:
  data:
    enable: false
  datasource:
    redisson:
      setting:
        host: "${it.redis.host}"
        port: ${it.redis.port}
        password: '${it.redis.password}'
        database: 0
    mongodb:
      enable: false
  app:
    name: t3-relay-one
    app-type: gateway-service
    scope-type: online
  net:
    bootstrap:
      relay:
        server:
          name: t3-relay-one
          bind-address: "${it.host}:${it.r1.server.port}"
          channel:
            encoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
            decoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
        client:
          channel:
            encoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
            decoder:
              message-body-codec: typeProtobufMessageBodyCodec
              verifier: cRC64CodecVerifier
              crypto: xOrCodecCrypto
    relay:
      clusters:
        - service: game-service
          serve-name: game-service
          discovery: false
          connection-size: 1
          serve-nodes:
            - id: 1
              healthy: true
              url: "tcp://${it.host}:${it.r2.server.port}"
      router:
        fixed-message-router:
          service: game-service

spring:
  data:
    redis:
      host: "${it.redis.host}"
      port: ${it.redis.port}
      password: '${it.redis.password}'

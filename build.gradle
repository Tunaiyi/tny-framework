import tny.convention.ProjectsExtension

plugins {
    // nmcp（Central Portal 上传器，central-publishing D3）：aggregation 挂根、模块侧经
    // tny.central 与 tny.publications 分别 apply，直接消费既有 mavenJava。
    id 'com.gradleup.nmcp' version '1.6.2' apply false
    id 'com.gradleup.nmcp.aggregation' version '1.6.2' apply false
    // 死声明清除（fix-dependency-version-governance D10，全仓复证零应用点）：
    // org.springframework.boot 插件（本工程无 bootJar 重打需求，springBootVersion 键仍由 BOM 导入句消费）与
    // com.gradle.plugin-publish 插件（Gradle Plugin Portal 发布通道从未接通，见 tny-game-doc-gradle 残迹注记）
    // 1.1.0→1.1.7（adopt-gradle-8-14-baseline D1）：1.1.5 起修复该插件在 Gradle 8.8 以上环境的兼容假设
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.baidu.jprotobuf' version '1.2.1' apply false
}

// 第三方插件在根脚本作用域先行应用（buildSrc 作用域无法解析父构建类路径插件，实测 8.5）。
// tny.git 创建的根工程类型化扩展 gitFlow（派生分支名、项目版本等值，实现类 tny.convention.GitFlow）
// 必须先于一切消费方应用——消费方经 getByType 按类型拉取，扩展不在位即报错；
// git 能力经 GitCli 门面单通道（grgit/JGit 依赖由 retire-grgit-channel 摘除）。
apply plugin: 'tny.git'
// 发布快速通道：releaseCut / releaseTag（语义契约见 docs/release-process.md；releaseMergeBack 已由
// redesign-devline-integration-model 删除）；分支流转门禁：integrateMain / mergeUpward
// （capability branch-integration-gates）
apply plugin: 'tny.release'
apply plugin: 'tny.integrate'

// 装配线成员判定与组号事实源收进类型化扩展 tny.projects（pilot-binary-build-conventions D4）：
// 命名约定判定、组号单一事实源注释（central-publishing D2 与 add-integration-testing D3 出处）
// 随实现迁入 tny.convention.ProjectsExtension / ProjectsPlugin 的 javadoc；约定权威定义仍在 settings.gradle 注释。
apply plugin: 'tny.projects'
def projectsExt = extensions.getByType(ProjectsExtension)

// Central 通道：centralBundle / centralUpload（capability central-publishing）；
// tny.central 须在 tny.projects 应用行之后加载（聚合成员判定依赖 projects 扩展在位）。
apply plugin: 'com.gradleup.nmcp.aggregation'
apply plugin: 'tny.central'

// 配置阶段跨工程对账（组号单一事实源、基准模块零发布合同）：程序性校验限定约定插件（gradle-build-style 需求一）
apply plugin: 'tny.module-checker'

// 装配线（各插件文件头声明职责与边界）：约定插件之间不互相 apply（脚本插件嵌套应用触发
// 类加载器服务缺失，实测 Gradle 8.5），故各线所需插件在此按依赖顺序逐一应用，幂等无副作用。
configure(subprojects) {
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'tny.dependency-management'
}
configure(projectsExt.gradleProjects()) {
    apply plugin: 'tny.publish'
    apply plugin: 'tny.publish.gate'
    apply plugin: 'tny.compile-baseline'
    apply plugin: 'tny.plugin-module'
}
configure(projectsExt.javaProjects()) {
    apply plugin: 'com.gradleup.nmcp'
    apply plugin: 'tny.publish'
    apply plugin: 'tny.publish.gate'
    apply plugin: 'tny.compile-baseline'
    apply plugin: 'tny.java-module'
    apply plugin: 'tny.integration-test'
    apply plugin: 'tny.publications'
    apply plugin: 'tny.github-packages'
}
